plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls']
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
}

application {
    mainClass = 'ru.ineprokin.Launcher'
}

sourceSets {
    main {
        java.srcDirs = ['src']
        resources.srcDirs = []
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def appName = 'Парольная защита'

tasks.register('appImage', Exec) {
    group = 'distribution'
    description = 'Собирает Парольная защита.exe, запускаемый двойным кликом без консоли'
    dependsOn tasks.installDist
    def dest = layout.buildDirectory.dir('app').get().asFile
    doFirst { delete file("$dest/$appName") }
    commandLine "${System.properties['java.home']}/bin/jpackage",
            '--type', 'app-image',
            '--input', layout.buildDirectory.dir("install/${project.name}/lib").get().asFile,
            '--main-jar', "${project.name}.jar",
            '--main-class', 'ru.ineprokin.Launcher',
            '--name', appName,
            '--dest', dest
}
